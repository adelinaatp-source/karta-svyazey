main{max-width:1080px;margin:0 auto;padding:22px 24px 90px}

.stat span{font-size:12.5px;color:var(--muted)}
table{border-collapse:collapse;width:100%;background:var(--paper);font-size:13.5px;margin:12px 0}
th,td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}
th{background:#f6fafb;font-weight:600;position:sticky;top:0;cursor:pointer;user-select:none}
th:hover{color:var(--blue)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
code{font:12.5px var(--mono);background:#f2f6f8;border-radius:4px;padding:1px 5px}
.badge{display:inline-block;font-size:11.5px;border-radius:20px;padding:1px 9px;white-space:nowrap}
.ok{background:#e4f2ea;color:var(--green)}
.no{background:#fbe9eb;color:var(--red)}
.warn{background:#fbf0e0;color:var(--amber)}
.info{background:#e6eefb;color:var(--blue)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0}
input[type=search],select{padding:7px 10px;border:1px solid var(--line);border-radius:8px;
  background:var(--paper);font:inherit;font-size:13.5px;color:var(--ink)}
input[type=search]{min-width:250px}
.note{background:var(--paper);border-left:3px solid var(--blue);border-radius:0 9px 9px 0;
  padding:11px 14px;margin:14px 0}
.note.red{border-left-color:var(--red)}
.note.amber{border-left-color:var(--amber)}
.note b{display:block;margin-bottom:3px}
ul{margin:8px 0;padding-left:20px}
li{margin:3px 0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;margin:12px 0}
.count{color:var(--muted);font-size:13px;margin:6px 0}
footer{max-width:1080px;margin:0 auto;padding:0 24px 40px;color:var(--muted);font-size:12.5px}
@media(max-width:640px){main,.top,footer{padding-left:14px;padding-right:14px}}

function contourOf(n){
  if(/лмб|Залог|Ломбард/.test(n)) return "Залог, ломбард";
  if(/Скупк/.test(n)) return "Скупка";
  if(/Инвентариз|Ревиз|Недостач/.test(n)) return "Инвентаризация, ревизия";
  if(/Бонус|Лояльн|Акци/.test(n)) return "Бонусы, лояльность, акции";
  if(/ГИИС|ДрагМет|Проб/.test(n)) return "ГИИС, драгметаллы, пробы";
  if(/Кадр|Сотрудник|Зарплат|Табел|Отпуск/.test(n)) return "Кадры, зарплата, табель";
  if(/Касс|Инкассац|Банк|Платеж|Оплат/.test(n)) return "Касса, банк, платежи";
  if(/Рознич|Продаж/.test(n)) return "Розница и продажи";
  if(/Склад|Перемещен|Номенклатур|Товар/.test(n)) return "Склад, товар, перемещения";
  return "";
}

  const rows = M.processes.filter(p => !pQ || (p.code+" "+p.name+" "+p.dom).toLowerCase().includes(pQ));
  const key = p => ({code:p.code,name:p.name,ops:p.ops,gaps:p.gaps,objTotal:p.objTotal,objOk:p.objOk,cat:p.cat}[pSort]);
  rows.sort((a,b)=>{ const x=key(a),y=key(b); const r = typeof x==="number" ? x-y : String(x).localeCompare(String(y),"ru"); return pDesc?-r:r; });
  app.innerHTML = "<h2>Процессы и их опора на систему</h2>"
    + "<p>Для каждого процесса показано, сколько объектов АРМ он называет и сколько из них подтверждается реестром системы. Заголовки таблицы сортируют.</p>"
    + '<div class="toolbar"><input type="search" id="pq" placeholder="Процесс, код или домен…" value="'+esc(pQ)+'"></div>'
    + '<div class="count">Показано '+rows.length+" из "+M.processes.length+"</div>"
    + "<table><thead><tr>"
    + ["code|Код","name|Процесс","cat|Категория","dom|Домен","ops|ОП","objTotal|Объектов","objOk|Подтв.","gaps|Пробелов"]
        .map(s=>{const [k,t]=s.split("|");const num=["ops","objTotal","objOk","gaps"].includes(k);
          return "<th data-k=\""+k+"\""+(num?' class="num"':"")+">"+t+(pSort===k?(pDesc?" ↓":" ↑"):"")+"</th>";}).join("")
    + "</tr></thead><tbody>"
    + rows.map(p => "<tr><td><code>"+p.code+"</code></td><td>"+esc(p.name)+"</td><td>"+(CATS[p.cat]||p.cat)
        + "</td><td>"+esc(p.dom)+'</td><td class=num>'+p.ops+'</td><td class=num>'+p.objTotal
        + '</td><td class=num>'+(p.objTotal ? (p.objOk<p.objTotal ? '<span class="badge no">'+p.objOk+"</span>" : p.objOk) : "—")
        + '</td><td class=num>'+p.gaps+"</td></tr>").join("")
    + "</tbody></table>";
  document.getElementById("pq").oninput = e => { pQ = e.target.value.trim().toLowerCase(); processes(); document.getElementById("pq").focus(); };
  app.querySelectorAll("th[data-k]").forEach(th => th.onclick = () => {
    const k = th.dataset.k; if(pSort===k) pDesc=!pDesc; else { pSort=k; pDesc=["ops","objTotal","objOk","gaps"].includes(k); } processes(); });
}

let oOnlyMissing = false, oQ = "";
function objects(){
  let rows = M.objects.slice().sort((a,b)=>a.name.localeCompare(b.name,"ru"));
  if(oOnlyMissing) rows = rows.filter(o=>!o.inArm);
  if(oQ) rows = rows.filter(o => (o.name+" "+o.bps).toLowerCase().includes(oQ));
  app.innerHTML = "<h2>Объекты АРМ, названные в картах</h2>"
    + "<p>Правило описания требует называть объект точно: не «в АРМ», а конкретный документ или регистр. Карты это соблюдают — "
    + objNamed+" имён. Проверка по реестру из "+M.meta.armObjects+" объектов: <b>"+objOk+" существуют</b>, <b>"+missing.length+" — нет</b>.</p>"
    + '<div class="note red"><b>Имена, которых в системе нет</b>'
    + "По таким именам нельзя строить интеграцию. Часть — обрывы строки в самой карте (<code>РН_Пл…</code>), часть — имена по смыслу вместо системных.<ul>"
    + missing.map(o => "<li><code>"+esc(o.name)+"</code> — в картах "+esc(o.bps)+"</li>").join("") + "</ul></div>"
    + '<div class="toolbar"><input type="search" id="oq" placeholder="Имя объекта или код процесса…" value="'+esc(oQ)+'">'
    + '<label><input type="checkbox" id="om"'+(oOnlyMissing?" checked":"")+'> только отсутствующие</label></div>'
    + '<div class="count">Показано '+rows.length+" из "+M.objects.length+"</div>"
    + "<table><thead><tr><th>Объект</th><th>В системе</th><th>Где упоминается</th></tr></thead><tbody>"
    + rows.map(o => "<tr><td><code>"+esc(o.name)+"</code></td><td>"
        + (o.inArm ? '<span class="badge ok">есть</span>' : '<span class="badge no">не найден</span>')
        + "</td><td>"+esc(o.bps)+"</td></tr>").join("")
    + "</tbody></table>";
  document.getElementById("oq").oninput = e => { oQ = e.target.value.trim().toLowerCase(); objects(); document.getElementById("oq").focus(); };
  document.getElementById("om").onchange = e => { oOnlyMissing = e.target.checked; objects(); };
}

function automation(){
  const byDom = {};
  M.bpmn.forEach(b => (byDom[b.dom] = byDom[b.dom] || []).push(b.name));
  app.innerHTML = "<h2>Автоматизация АРМ против карт</h2>"
    + "<p>В базе знаний "+M.meta.bpmnTotal+" процессов BPMN. Ниже — те, что разложены по доменам; отдельно перечислено, чего нет ни в одной карте.</p>"
    + '<div class="note red"><b>Десять процессов, не отражённых ни в одной карте</b>'
    + "<table><thead><tr><th>Процесс АРМ</th><th>Что это</th><th>Чья карта</th></tr></thead><tbody>"
    + NOT_COVERED.map(([a,b,c]) => "<tr><td>"+esc(a)+"</td><td>"+esc(b)+"</td><td><code>"+esc(c)+"</code></td></tr>").join("")
    + "</tbody></table></div>"
    + "<h3>Домены автоматизации</h3>"
    + '<div class="grid2">'
    + Object.keys(byDom).sort((a,b)=>byDom[b].length-byDom[a].length).map(d =>
        '<div class="card"><b>'+esc(d)+'</b> <span class="badge info">'+byDom[d].length+"</span><ul>"
        + byDom[d].sort().map(n=>"<li>"+esc(n)+"</li>").join("")+"</ul></div>").join("")
    + "</div>";
}

function gaps(){
  app.innerHTML = "<h2>Где описание и система расходятся</h2>"
    + "<p>Восемь расхождений, найденных сплошной сверкой. Ни одно не разрешено: по правилу описания выбор канона — дело владельца процесса, а не аналитика.</p>"
    + DISCREP.map(([t,card,arm,lvl]) =>
        '<div class="note '+lvl+'"><b>'+esc(t)+"</b><p><b>В карте:</b> "+esc(card)+"</p><p><b>В системе:</b> "+arm+"</p></div>").join("")
    + '<div class="note"><b>Важная оговорка</b>'
    + "Проекции базы знаний сделаны <b>из кода</b>, а не из данных. Они говорят, что система умеет, а не чем пользуются люди. "
    + "«В АРМ есть объект» и «объект работает» — разные утверждения, и каждое требует отдельной проверки.</div>";
}

function limits(){
  app.innerHTML = "<h2>Что эта карта не утверждает</h2>"
    + "<ul>"
    + "<li><b>Ни один процесс не утверждён.</b> Владелец не назначен ни у одного из 49; статус всех карт — «в работе».</li>"
    + "<li><b>Расхождения не разрешены.</b> Там, где карта и код говорят разное, сохранены обе версии.</li>"
    + "<li><b>Проекции — из кода на срез "+M.meta.kb+".</b> Выборок данных из системы не делалось.</li>"
    + "<li><b>Битрикс24, 1С и таблицы вне АРМ не проверялись</b> — база знаний о них не свидетельствует.</li>"
    + "<li><b>Принадлежность объекта контуру</b> определена по имени, а не по модели данных.</li>"
    + "</ul>"
    + "<h3>Откуда данные</h3><ul>"
    + "<li>Карты процессов — репозиторий описания процессов, коммит <code>"+M.meta.commit+"</code> от "+M.meta.date+", 49 файлов.</li>"
    + "<li>Реестр объектов и процессов BPMN — база знаний АРМ, проекции слоёв 4–5, срез "+M.meta.kb+".</li>"
    + "<li>Расхождения — сплошная сверка имён объектов и покрытия автоматизации плюс разбор отдельных карт.</li>"
    + "</ul>"
    + '<div class="note amber"><b>Персональные данные</b>'
    + "В карту не включены ФИО сотрудников, тексты интервью и адресаты вопросов: она показывает только связь описания с системой.</div>";
}

function render(){ nav(); ({overview,processes,objects,automation,gaps,limits}[current])(); window.scrollTo(0,0); }
render();
</script>
</body>
</html>
