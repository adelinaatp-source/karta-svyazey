<title>Карта связей · процессы и АРМ</title>
<style>
:root{--ink:#14202b;--muted:#5e6b78;--line:#d6dee5;--paper:#fff;--bg:#edf3f5;--soft:#f6fafb;
  --blue:#155ed0;--amber:#a95c00;--red:#a12c35;--green:#18714b;
  --mono:ui-monospace,"SF Mono",Consolas,monospace}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);display:flex;flex-direction:column;
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
.top{background:var(--paper);border-bottom:1px solid var(--line);padding:16px 24px 0;flex:0 0 auto}
.top h1{margin:0 0 3px;font-size:21px;letter-spacing:-.02em}
.top p{margin:0 0 11px;color:var(--muted);font-size:13px}
nav{display:flex;gap:2px;flex-wrap:wrap}
nav button{border:1px solid transparent;border-bottom:0;background:none;padding:8px 14px;
  border-radius:8px 8px 0 0;cursor:pointer;color:var(--muted);font:inherit;font-size:14px}
nav button:hover{color:var(--ink);background:var(--bg)}
nav button.active{background:var(--bg);border-color:var(--line);color:var(--ink);font-weight:600;margin-bottom:-1px;padding-bottom:9px}
main{flex:1 1 auto;overflow:hidden;display:flex}
/* --- две колонки --- */
.split{display:grid;grid-template-columns:340px 1fr;width:100%;overflow:hidden}
.list{border-right:1px solid var(--line);background:var(--paper);overflow-y:auto;display:flex;flex-direction:column}
.list .head{position:sticky;top:0;background:var(--paper);border-bottom:1px solid var(--line);padding:11px 14px;z-index:2}
.list .items{padding:6px 0 40px}
.detail{overflow-y:auto;padding:22px 26px 90px}
.detail .inner{max-width:760px}
.single{overflow-y:auto;padding:22px 26px 90px;width:100%}
.single .inner{max-width:940px;margin:0 auto}
.row{display:block;width:100%;text-align:left;border:0;background:none;cursor:pointer;
  padding:8px 14px;border-left:3px solid transparent;line-height:1.35;font:inherit;color:inherit}
.row:hover{background:var(--soft)}
.row.on{background:#e8f0fb;border-left-color:var(--blue)}
.row .k{font:600 12px var(--mono);color:var(--muted)}
.row.on .k{color:var(--blue)}
.row .t{display:block;font-size:13.5px;margin-top:1px}
.row .r{float:right;font:600 11px/1.5 var(--mono);color:var(--muted)}
.row .r.bad{color:var(--red)}
h2{font-size:19px;margin:0 0 8px;letter-spacing:-.015em}
h3{font-size:15.5px;margin:22px 0 6px}
p{margin:8px 0}
.muted{color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:9px;margin:14px 0}
.card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:11px 13px}
.stat strong{display:block;font-size:24px;line-height:1.1;letter-spacing:-.02em}
.stat span{font-size:12px;color:var(--muted)}
table{border-collapse:collapse;width:100%;background:var(--paper);font-size:13.5px;margin:10px 0}
th,td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}
th{background:var(--soft);font-weight:600}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--blue)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.clickable{cursor:pointer}
tr.clickable:hover td{background:var(--soft)}
code{font:12.5px var(--mono);background:#f2f6f8;border-radius:4px;padding:1px 5px}
.badge{display:inline-block;font-size:11.5px;border-radius:20px;padding:1px 9px;white-space:nowrap;margin:1px 0}
.ok{background:#e4f2ea;color:var(--green)}
.no{background:#fbe9eb;color:var(--red)}
.warn{background:#fbf0e0;color:var(--amber)}
.info{background:#e6eefb;color:var(--blue)}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:20px;padding:3px 11px;
  font-size:12.5px;cursor:pointer;font:inherit;color:var(--blue)}
.chip:hover{border-color:var(--blue);background:#f4f8fe}
.chip.plain{color:var(--muted);cursor:default}
.chip.plain:hover{border-color:var(--line);background:var(--paper)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
input[type=search],select{width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:8px;
  background:var(--paper);font:inherit;font-size:13.5px;color:var(--ink)}
.filters{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.pill{border:1px solid var(--line);background:none;border-radius:20px;padding:2px 10px;font-size:12px;cursor:pointer;color:var(--muted)}
.pill:hover{border-color:var(--blue)}
.pill.on{background:var(--blue);border-color:var(--blue);color:#fff}
.note{background:var(--paper);border-left:3px solid var(--blue);border-radius:0 9px 9px 0;padding:11px 14px;margin:13px 0}
.note.red{border-left-color:var(--red)}
.note.amber{border-left-color:var(--amber)}
.note b.hd{display:block;margin-bottom:3px}
ul{margin:7px 0;padding-left:20px}
li{margin:3px 0}
.count{color:var(--muted);font-size:12.5px;margin:4px 0 0}
.empty{color:var(--muted);padding:40px 6px;text-align:center}
.crumb{font:12px var(--mono);color:var(--muted);margin-bottom:6px}
.bar{height:7px;border-radius:4px;background:#eef3f5;overflow:hidden;margin:5px 0 2px}
.bar i{display:block;height:100%;background:var(--blue)}
footer{flex:0 0 auto;background:var(--paper);border-top:1px solid var(--line);
  padding:9px 24px;color:var(--muted);font-size:12px}
@media(max-width:820px){
  .split{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .list{border-right:0;border-bottom:1px solid var(--line);max-height:44vh}
  .detail,.single{padding:18px 16px 70px}
  .top{padding:14px 16px 0}
}
</style>
</head>

function fromHash(){
  const [v,k] = decodeURIComponent(location.hash.replace(/^#/,"")).split("/");
  if(VIEWS.some(x=>x[0]===v)){ S.v=v;
    if(v==="processes" && k && P[k]) S.proc=k;
    if(v==="objects"   && k && O[k]) S.obj=k;
    if(v==="discrep"   && k && DISCREP.some(d=>d.id===k)) S.disc=k;
  }
}
function go(v,k){ S.v=v; if(k){ if(v==="processes")S.proc=k; if(v==="objects")S.obj=k; if(v==="automation")S.bpmn=k; if(v==="discrep")S.disc=k; } setHash(); render(); }
window.addEventListener("hashchange",()=>{ const before=JSON.stringify([S.v,S.proc,S.obj,S.disc]); fromHash(); if(JSON.stringify([S.v,S.proc,S.obj,S.disc])!==before) render(); });

/* ================= общие кусочки ================= */
const stat = (n,t) => '<div class="card stat"><strong>'+n+"</strong><span>"+t+"</span></div>";
const pchip = c => P[c] ? '<button class="chip" data-go="processes" data-k="'+c+'">'+c+" · "+esc(P[c].name)+"</button>"
                        : '<button class="chip plain">'+esc(c)+"</button>";
const ochip = n => '<button class="chip'+(O[n]&&!O[n].inArm?" plain":"")+'" data-go="objects" data-k="'+esc(n)+'">'
                 + (O[n]&&!O[n].inArm?"⚠ ":"")+"<code>"+esc(n)+"</code></button>";
function split(listHtml, detailHtml){ return '<div class="split"><div class="list">'+listHtml+'</div><div class="detail"><div class="inner">'+detailHtml+"</div></div></div>"; }
function single(html){ return '<div class="single"><div class="inner">'+html+"</div></div>"; }

/* ================= обзор ================= */
function overview(){
  const rows = CONTOURS.map(([t,n,re]) => {
    const named = M.objects.filter(o => o.inArm && re.test(o.name)).length;
    const pct = Math.round(100*named/n);
    return "<tr><td>"+t+'</td><td class=num>'+n+"</td><td class=num>"+named
      + '</td><td><div class="bar"><i style="width:'+Math.min(pct,100)+'%"></i></div><span class="muted" style="font-size:12px">'+pct+" %</span></td></tr>";
  }).join("");
  app.innerHTML = single(
    "<h2>Что показывает эта карта</h2>"
    + "<p>Третья волна описала <b>49 процессов</b> со слов сотрудников. База знаний АРМ описывает <b>ту же работу со стороны системы</b>: "
    + M.meta.armObjects+" объектов и "+M.meta.bpmnTotal+" процессов BPMN, спроецированных из кода. "
    + "Карта сводит два описания: где они сходятся, где расходятся и где система умеет то, чего в картах нет.</p>"
    + '<section class="stats">'
    + stat(M.processes.length,"процессов") + stat(sumOps,"операций маршрутов")
    + stat(M.objects.length,"объектов названо") + stat(objOk,"подтверждено реестром")
    + stat(missing.length,"имён не существует") + stat(sumBlock,"блокирующих пробелов")
    + "</section>"
    + '<div class="note"><b class="hd">Как пользоваться</b>'
    + "Во вкладках слева — список, справа подробности. Всё, что подчёркнуто как кнопка, ведёт дальше: процесс → его объекты и связи, объект → все процессы, где он назван, расхождение → карты, которых оно касается. Ссылку на конкретный процесс можно скопировать из адресной строки."
    + "</div>"
    + '<div class="note red"><b class="hd">Что требует решения</b>'
    + "Из "+M.meta.bpmnTotal+" процессов автоматизации АРМ (из них "+M.meta.bpmnOrphan+" — узлы без привязки к домену) <b>двенадцать не отражены ни в одной карте</b>. Среди них — "
    + '<button class="chip" data-go="automation" data-k="93. Выплата положительной разницы после реализации">выплата положительной разницы после реализации</button>, '
    + "притом что карта "+pchip("БП-07")+" прямо пишет: «ни один из 95 документов не описывает, как эта разница считается».</div>"
    + "<h3>Покрытие объектов АРМ по контурам</h3>"
    + "<table><thead><tr><th>Контур</th><th class=num>В АРМ</th><th class=num>Названо</th><th>Покрытие</th></tr></thead><tbody>"+rows+"</tbody></table>"
    + '<p class="muted" style="font-size:12.5px">Принадлежность объекта контуру определена по его имени, а не по модели данных, — цифры ориентировочные.</p>');
}

/* ================= процессы ================= */
function processes(){
  const q = S.pq.toLowerCase();
  const list = M.processes.filter(p => (!S.pf || (S.pf==="bad" ? p.objTotal>p.objOk : S.pf==="noobj" ? p.objTotal===0 : true))
    && (!q || (p.code+" "+p.name+" "+p.dom).toLowerCase().includes(q)));
  if(list.length && !list.some(p=>p.code===S.proc)) S.proc = list[0].code;
  const items = list.map(p => '<button class="row'+(p.code===S.proc?" on":"")+'" data-sel="'+p.code+'">'
    + '<span class="r'+(p.objTotal>p.objOk?" bad":"")+'">'+(p.objTotal?p.objOk+"/"+p.objTotal:"—")+"</span>"
    + '<span class="k">'+p.code+'</span><span class="t">'+esc(p.name)+"</span></button>").join("")
    || '<div class="empty">Ничего не найдено</div>';
  const head = '<div class="head"><input type="search" id="pq" placeholder="Процесс, код или домен…" value="'+esc(S.pq)+'">'
    + '<div class="filters">'
    + [["","все"],["bad","с ошибками имён"],["noobj","без объектов АРМ"]].map(([v,t])=>
        '<button class="pill'+(S.pf===v?" on":"")+'" data-pf="'+v+'">'+t+"</button>").join("")
    + '</div><div class="count">'+list.length+" из "+M.processes.length+" · справа — объекты подтверждены / названо</div></div>";
  app.innerHTML = split(head+'<div class="items">'+items+"</div>", procDetail(P[S.proc]));
  bindList("pq", v => S.pq=v, "pf", v => S.pf=v, processes);
}
function procDetail(p){
  if(!p) return '<div class="empty">Выберите процесс слева</div>';
  const objs = p.objs.slice().sort((a,b)=>a.n.localeCompare(b.n,"ru"));
  const bad = objs.filter(o=>!o.ok);
  const rel = DISCREP.filter(d => d.bp.includes(p.code));
  const cover = Object.entries(NOT_COVERED).filter(([,v]) => v[0]===p.code);
  const back = M.processes.filter(x => x.next.includes(p.code)).map(x=>x.code);
  const types = Object.entries(p.gapTypes).sort((a,b)=>b[1]-a[1]);
  return '<div class="crumb">'+CATS[p.cat]+" · домен "+esc(p.dom)+"</div><h2>"+p.code+" · "+esc(p.name)+"</h2>"
    + '<section class="stats">'+stat(p.ops,"операций")+stat(p.objTotal,"объектов названо")
    + stat(p.objOk,"подтверждено")+stat(p.gaps,"пробелов")+stat(p.block,"блокирующих")+"</section>"
    + (bad.length ? '<div class="note red"><b class="hd">Имена, которых нет в системе</b>'
        + bad.map(o=>"<code>"+esc(o.n)+"</code>").join(" · ")
        + "<p class=\"muted\" style=\"margin-bottom:0\">По таким именам нельзя строить интеграцию.</p></div>" : "")
    + (rel.length ? '<div class="note amber"><b class="hd">Расхождения с системой</b>'
        + rel.map(d=>'<button class="chip" data-go="discrep" data-k="'+d.id+'">'+esc(d.t)+"</button>").join(" ")+"</div>" : "")
    + (cover.length ? '<div class="note red"><b class="hd">Автоматизация АРМ, не отражённая в карте</b>'
        + cover.map(([k])=>'<button class="chip" data-go="automation" data-k="'+esc(k)+'">'+esc(k)+"</button>").join(" ")+"</div>" : "")
    + "<h3>Объекты АРМ, названные в карте</h3>"
    + (objs.length ? '<div class="chips">'+objs.map(o=>ochip(o.n)).join("")+"</div>"
                   : '<p class="muted">Карта не называет ни одного объекта АРМ.</p>')
    + "<h3>Связи</h3>"
    + "<p><b>Запускается после:</b> "+(p.after.length?'</p><div class="chips">'+p.after.map(pchip).join("")+"</div>":'<span class="muted">не задано</span></p>')
    + "<p><b>Передаёт в:</b> "+(p.next.length?'</p><div class="chips">'+p.next.map(pchip).join("")+"</div>":'<span class="muted">не задано</span></p>')
    + "<p><b>Передают сюда:</b> "+(back.length?'</p><div class="chips">'+back.map(pchip).join("")+"</div>":'<span class="muted">никто</span></p>')
    + "<h3>Пробелы по типам</h3>"
    + (types.length ? "<table><thead><tr><th>Тип</th><th class=num>Сколько</th><th>Что это значит</th></tr></thead><tbody>"
        + types.map(([t,n])=>"<tr><td>"+esc(t)+'</td><td class=num>'+n+"</td><td>"+esc(GAPNOTE[t]||"")+"</td></tr>").join("")
        + "</tbody></table>" : '<p class="muted">Пробелы не размечены.</p>')
    + (p.gapSample.length ? "<h3>Примеры блокирующих пробелов</h3>"
        + "<table><thead><tr><th>ID</th><th>Что неизвестно</th><th>Адресат</th></tr></thead><tbody>"
        + p.gapSample.map(g=>"<tr><td><code>"+esc(g.id)+"</code></td><td>"+esc(g.q)+"</td><td>"+esc(g.a)+"</td></tr>").join("")
        + "</tbody></table>" : "");
}

/* ================= объекты ================= */
function objects(){
  const q = S.oq.toLowerCase();
  let list = M.objects.slice().sort((a,b)=>a.name.localeCompare(b.name,"ru"));
  if(S.of==="miss") list = list.filter(o=>!o.inArm);
  if(q) list = list.filter(o => (o.name+" "+o.bps.join(" ")).toLowerCase().includes(q));
  if(list.length && !list.some(o=>o.name===S.obj)) S.obj = list[0].name;
  const items = list.map(o => '<button class="row'+(o.name===S.obj?" on":"")+'" data-sel="'+esc(o.name)+'">'
    + '<span class="r'+(o.inArm?"":" bad")+'">'+(o.inArm?o.bps.length:"нет")+"</span>"
    + '<span class="t"><code>'+esc(o.name)+"</code></span></button>").join("")
    || '<div class="empty">Ничего не найдено</div>';
  const head = '<div class="head"><input type="search" id="oq" placeholder="Имя объекта или код процесса…" value="'+esc(S.oq)+'">'
    + '<div class="filters">'+[["","все "+M.objects.length],["miss","не найдены "+missing.length]].map(([v,t])=>
        '<button class="pill'+(S.of===v?" on":"")+'" data-pf="'+v+'">'+t+"</button>").join("")
    + '</div><div class="count">'+list.length+" объектов · справа — в скольких картах назван</div></div>";
  app.innerHTML = split(head+'<div class="items">'+items+"</div>", objDetail(O[S.obj]));
  bindList("oq", v => S.oq=v, "pf", v => S.of=v, objects);
}
function objDetail(o){
  if(!o) return '<div class="empty">Выберите объект слева</div>';
  return "<h2><code>"+esc(o.name)+"</code></h2>"
    + "<p>"+(o.inArm ? '<span class="badge ok">есть в реестре АРМ</span>'
                     : '<span class="badge no">в реестре АРМ не найден</span>')+"</p>"
    + (o.inArm ? "<p>Имя подтверждается реестром из "+M.meta.armObjects+" объектов системы. Это значит, что ссылка в карте указывает на существующий документ или регистр, и по ней можно строить интеграцию.</p>"
               : '<div class="note red"><b class="hd">Имени нет в системе</b>Возможные причины: опечатка, сокращение, имя придумано по смыслу вместо системного или строка оборвана многоточием прямо в карте. По такому имени ИТ будет искать несуществующий объект.</div>')
    + "<h3>Где назван</h3><div class=\"chips\">"+o.bps.map(pchip).join("")+"</div>"
    + '<p class="muted" style="font-size:12.5px">Карты, в которых встречается это имя. Щелчок открывает процесс.</p>';
}

/* ================= автоматизация ================= */
function automation(){
  const q = S.aq.toLowerCase();
  const all = M.bpmn.map(b => ({...b, uncovered: !!NOT_COVERED[b.name]}));
  Object.keys(NOT_COVERED).forEach(k => { if(!all.some(b=>b.name===k)) all.push({dom:"Управление сделками",name:k,uncovered:true}); });
  let list = all.slice().sort((a,b)=> (b.uncovered-a.uncovered) || a.dom.localeCompare(b.dom,"ru") || a.name.localeCompare(b.name,"ru"));
  if(S.af==="unc") list = list.filter(b=>b.uncovered);
  if(q) list = list.filter(b => (b.name+" "+b.dom).toLowerCase().includes(q));
  if(list.length && !list.some(b=>b.name===S.bpmn)) S.bpmn = list[0].name;
  const uncCount = all.filter(b=>b.uncovered).length;
  const items = list.map(b => '<button class="row'+(b.name===S.bpmn?" on":"")+'" data-sel="'+esc(b.name)+'">'
    + (b.uncovered?'<span class="r bad">нет в картах</span>':"")
    + '<span class="k">'+esc(b.dom)+'</span><span class="t">'+esc(b.name)+"</span></button>").join("")
    || '<div class="empty">Ничего не найдено</div>';
  const head = '<div class="head"><input type="search" id="aq" placeholder="Процесс или домен автоматизации…" value="'+esc(S.aq)+'">'
    + '<div class="filters">'+[["","все "+all.length],["unc","не отражены "+uncCount]].map(([v,t])=>
        '<button class="pill'+(S.af===v?" on":"")+'" data-pf="'+v+'">'+t+"</button>").join("")
    + '</div><div class="count">'+list.length+" процессов автоматизации</div></div>";
  const b = list.find(x=>x.name===S.bpmn) || all.find(x=>x.name===S.bpmn);
  app.innerHTML = split(head+'<div class="items">'+items+"</div>", bpmnDetail(b));
  bindList("aq", v => S.aq=v, "pf", v => S.af=v, automation);
}
function bpmnDetail(b){
  if(!b) return '<div class="empty">Выберите процесс слева</div>';
  const nc = NOT_COVERED[b.name];
  return '<div class="crumb">домен автоматизации · '+esc(b.dom)+"</div><h2>"+esc(b.name)+"</h2>"
    + (nc ? '<div class="note red"><b class="hd">Не отражён ни в одной карте</b>'+esc(nc[1])
            + "<p style=\"margin-bottom:0\">Ближе всего по смыслу: "+pchip(nc[0])+"</p></div>"
          : '<p><span class="badge ok">процесс автоматизации АРМ</span></p>'
            + "<p>Процесс есть в движке BPMN системы. Карта, которая описывает эту работу со стороны людей, определяется по домену — сверка «процесс автоматизации → карта» пока сделана только для тех, что в картах не отражены вовсе.</p>")
    + "<h3>Соседние процессы домена</h3><div class=\"chips\">"
    + M.bpmn.filter(x=>x.dom===b.dom && x.name!==b.name).slice(0,14)
        .map(x=>'<button class="chip" data-go="automation" data-k="'+esc(x.name)+'">'+esc(x.name)+"</button>").join("")
    + "</div>";
}

/* ================= расхождения ================= */
function discrep(){
  const items = DISCREP.map(d => '<button class="row'+(d.id===S.disc?" on":"")+'" data-sel="'+d.id+'">'
    + '<span class="r'+(d.lvl==="red"?" bad":"")+'">'+(d.lvl==="red"?"важно":"")+"</span>"
    + '<span class="t">'+esc(d.t)+'</span><span class="k">'+d.bp.join(" ")+"</span></button>").join("");
  const head = '<div class="head"><b>Восемь расхождений</b><div class="count">Найдены сплошной сверкой карт с базой знаний</div></div>';
  const d = DISCREP.find(x=>x.id===S.disc) || DISCREP[0];
  app.innerHTML = split(head+'<div class="items">'+items+"</div>",
      "<h2>"+esc(d.t)+"</h2>"
    + '<div class="chips">'+d.bp.map(pchip).join("")+"</div>"
    + '<div class="note"><b class="hd">Что записано в карте</b>'+esc(d.card)+"</div>"
    + '<div class="note '+(d.lvl==="red"?"red":"amber")+'"><b class="hd">Что показывает система</b>'+d.arm+"</div>"
    + "<h3>Что это значит</h3><p>"+d.what+"</p>"
    + '<div class="note"><b class="hd">Расхождение не разрешено</b>'
    + "По правилу описания процессов выбор канона — дело владельца процесса, а не аналитика. Обе версии сохранены как есть.</div>");
  app.querySelectorAll("[data-sel]").forEach(b => b.onclick = () => { S.disc = b.dataset.sel; setHash(); discrep(); });
}

/* ================= границы ================= */
function limits(){
  app.innerHTML = single("<h2>Что эта карта не утверждает</h2><ul>"
    + "<li><b>Ни один процесс не утверждён.</b> Владелец не назначен ни у одного из 49; статус всех карт — «в работе».</li>"
    + "<li><b>Расхождения не разрешены.</b> Там, где карта и код говорят разное, сохранены обе версии.</li>"
    + "<li><b>Проекции сделаны из кода</b> на срез "+M.meta.kb+". Они говорят, что система умеет, а не чем пользуются люди: «объект есть» и «объект работает» — разные утверждения.</li>"
    + "<li><b>Битрикс24, 1С и таблицы вне АРМ не проверялись</b> — база знаний о них не свидетельствует, и отсутствие объекта в АРМ не означает, что процесс описан неверно.</li>"
    + "<li><b>Принадлежность объекта контуру</b> определена по имени, а не по модели данных.</li>"
    + "<li><b>Сверка «процесс автоматизации → карта»</b> сделана только для тех процессов АРМ, которых нет в картах вовсе.</li>"
    + "</ul><h3>Откуда данные</h3><ul>"
    + "<li>Карты процессов — репозиторий описания процессов, коммит <code>"+M.meta.commit+"</code> от "+M.meta.date+", 49 файлов.</li>"
    + "<li>Реестр объектов и процессов BPMN — база знаний АРМ, проекции слоёв 4–5, срез "+M.meta.kb+".</li>"
    + "<li>Классификация пробелов — по формулировке пробела, девять типов.</li>"
    + "</ul>"
    + '<div class="note amber"><b class="hd">Персональные данные</b>'
    + "В карту не включены ФИО сотрудников, тексты интервью, адресаты вопросов и полные тексты карт: она показывает только связь описания с системой.</div>");
}

/* ================= связывание ================= */
function bindList(qid, setQ, pfAttr, setF, rerender){
  const inp = document.getElementById(qid);
  if(inp) inp.oninput = e => { setQ(e.target.value.trim()); rerender();
    const el = document.getElementById(qid); el.focus(); el.setSelectionRange(el.value.length, el.value.length); };
  app.querySelectorAll("[data-pf]").forEach(b => b.onclick = () => { setF(b.dataset.pf); rerender(); });
  app.querySelectorAll("[data-sel]").forEach(b => b.onclick = () => {
    const k = b.dataset.sel;
    if(S.v==="processes") S.proc=k; else if(S.v==="objects") S.obj=k; else if(S.v==="automation") S.bpmn=k;
    setHash(); rerender();
  });
}
tabsEl.onclick = e => { const b = e.target.closest("button[data-v]"); if(b) go(b.dataset.v); };
app.addEventListener("click", e => {
  const b = e.target.closest("[data-go]"); if(!b) return;
  go(b.dataset.go, b.dataset.k);
});
function nav(){ tabsEl.innerHTML = VIEWS.map(([id,t]) =>
  '<button data-v="'+id+'" class="'+(id===S.v?"active":"")+'">'+t+"</button>").join(""); }
function render(){ nav(); ({overview,processes,objects,automation,discrep,limits}[S.v])(); }
fromHash(); render();
</script>
</body>
</html>
